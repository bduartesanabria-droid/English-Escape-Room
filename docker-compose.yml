services:
  app:
    build: .
    container_name: english-escape-room
    ports:
      # Host port defaults to 3900 (an uncommon high port; 3000/8080 are often
      # already allocated on hosts). Override with: HOST_PORT=8081 docker compose up -d
      - "${HOST_PORT:-3900}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Copy .env.example to .env and set GEMINI_API_KEY, or the server falls
      # back to its built-in pedagogical rule engine.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APP_URL=${APP_URL:-}
    volumes:
      # Persist the SQLite database across container restarts
      - escape-room-data:/app/data
    restart: unless-stopped

volumes:
  escape-room-data: