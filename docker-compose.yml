services:
  app:
    build: .
    container_name: english-escape-room
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Copy .env.example to .env and set GEMINI_API_KEY, or the server falls
      # back to its built-in pedagogical rule engine.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APP_URL=${APP_URL:-}
    restart: unless-stopped